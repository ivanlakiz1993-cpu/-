<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <pattern id="grain-lines" width="512" height="8" patternUnits="userSpaceOnUse">
      <rect width="512" height="8" fill="#fff"/>
      <path d="M0 1.5H512M0 5.25H512" stroke="#555" stroke-opacity=".17" stroke-width=".6"/>
      <path d="M0 3.6H512M0 7.25H512" stroke="#fff" stroke-opacity=".55" stroke-width=".5"/>
    </pattern>
    <filter id="micrograin" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency=".018 .48" numOctaves="2" seed="17" stitchTiles="stitch"/>
      <feComponentTransfer><feFuncR type="linear" slope=".1" intercept=".9"/><feFuncG type="linear" slope=".1" intercept=".9"/><feFuncB type="linear" slope=".1" intercept=".9"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#grain-lines)"/>
  <rect width="512" height="512" filter="url(#micrograin)" opacity=".3"/>
</svg>
