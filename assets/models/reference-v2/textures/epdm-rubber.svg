<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <filter id="rubber" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency=".18 .18" numOctaves="4" seed="53" stitchTiles="stitch"/>
      <feComponentTransfer><feFuncR type="linear" slope=".2" intercept=".8"/><feFuncG type="linear" slope=".2" intercept=".8"/><feFuncB type="linear" slope=".2" intercept=".8"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="512" height="512" fill="#fff"/>
  <rect width="512" height="512" filter="url(#rubber)" opacity=".5"/>
</svg>
