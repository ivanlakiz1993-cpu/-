<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <pattern id="brass-lines" width="512" height="6" patternUnits="userSpaceOnUse">
      <rect width="512" height="6" fill="#fff"/>
      <path d="M0 1.5H512M0 4.5H512" stroke="#777" stroke-opacity=".12" stroke-width=".5"/>
    </pattern>
    <filter id="brass" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency=".03 .3" numOctaves="2" seed="89" stitchTiles="stitch"/>
      <feComponentTransfer><feFuncR type="linear" slope=".1" intercept=".9"/><feFuncG type="linear" slope=".1" intercept=".9"/><feFuncB type="linear" slope=".1" intercept=".9"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#brass-lines)"/>
  <rect width="512" height="512" filter="url(#brass)" opacity=".24"/>
</svg>
