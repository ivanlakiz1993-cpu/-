<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <filter id="polymer" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency=".16 .16" numOctaves="2" seed="67" stitchTiles="stitch"/>
      <feComponentTransfer><feFuncR type="linear" slope=".12" intercept=".88"/><feFuncG type="linear" slope=".12" intercept=".88"/><feFuncB type="linear" slope=".12" intercept=".88"/></feComponentTransfer>
    </filter>
    <pattern id="mould" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M0 15.5H16" stroke="#777" stroke-opacity=".11" stroke-width=".5"/>
    </pattern>
  </defs>
  <rect width="512" height="512" fill="#fff"/>
  <rect width="512" height="512" filter="url(#polymer)" opacity=".35"/>
  <rect width="512" height="512" fill="url(#mould)"/>
</svg>
