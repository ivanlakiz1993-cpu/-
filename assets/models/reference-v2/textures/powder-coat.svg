<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <filter id="satin-powder" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency=".105 .105" numOctaves="3" seed="41" stitchTiles="stitch"/>
      <feComponentTransfer>
        <feFuncR type="linear" slope=".12" intercept=".82"/>
        <feFuncG type="linear" slope=".12" intercept=".82"/>
        <feFuncB type="linear" slope=".12" intercept=".82"/>
      </feComponentTransfer>
    </filter>
  </defs>
  <rect width="512" height="512" fill="#fff"/>
  <rect width="512" height="512" filter="url(#satin-powder)" opacity=".5"/>
</svg>
